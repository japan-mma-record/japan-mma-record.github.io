<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Buffer の許可｜日本MMA戦績録</title>
<style>
body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.8;color:#111;background:#fff}
button{font-size:18px;padding:12px 24px;border:0;border-radius:8px;background:#168eea;color:#fff;cursor:pointer}
textarea{width:100%;height:140px;font-family:monospace;font-size:12px}
.muted{color:#666;font-size:14px}
</style></head><body>
<h1>Buffer の許可（最初の1回だけ）</h1>
<p>毎朝の X への自動投稿を、人の手なしで続けるための許可です。下のボタンを押すと Buffer の画面に移るので、「許可」を押してください。</p>
<p><button id="go">Buffer に許可する</button></p>
<div id="out" hidden>
<p><b>許可が終わりました。</b>下の文字は、許可のしるしを暗号化したものです（このままでは誰にも使えません）。</p>
<textarea id="blob" readonly></textarea>
</div>
<p id="msg" class="muted"></p>
<script>
const CONF_URL = 'data/buffer_oauth.json';
const b64u = a => btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const rnd = n => b64u(crypto.getRandomValues(new Uint8Array(n)));
async function conf(){ return (await fetch(CONF_URL, {cache:'no-store'})).json(); }
async function encrypt(obj, pem){
  const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----/g,'').replace(/\s/g,'')), c=>c.charCodeAt(0));
  const pub = await crypto.subtle.importKey('spki', der, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['encrypt']);
  const k = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, new TextEncoder().encode(JSON.stringify(obj)));
  const raw = await crypto.subtle.exportKey('raw', k);
  const ek = await crypto.subtle.encrypt({name:'RSA-OAEP'}, pub, raw);
  return JSON.stringify({v:1, k:b64(ek), iv:b64(iv), ct:b64(ct)});
}
document.getElementById('go').onclick = async () => {
  const c = await conf();
  const verifier = rnd(48), state = rnd(16);
  const ch = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('pkce', JSON.stringify({verifier, state}));
  const q = new URLSearchParams({client_id:c.client_id, redirect_uri:c.redirect_uri, response_type:'code', scope:c.scope,
                                 state, code_challenge:ch, code_challenge_method:'S256', prompt:'consent'});
  location.href = 'https://auth.buffer.com/auth?' + q.toString();
};
(async () => {
  const p = new URLSearchParams(location.search);
  if (p.get('error')) { document.getElementById('msg').textContent = '許可されませんでした：' + p.get('error'); return; }
  if (!p.get('code')) return;
  const s = JSON.parse(sessionStorage.getItem('pkce') || '{}');
  if (!s.state || s.state !== p.get('state')) { document.getElementById('msg').textContent = '確認の文字が合いません。もう一度ボタンから始めてください。'; return; }
  const c = await conf();
  // その場で Buffer に「更新の鍵」をもらい、公開鍵で暗号化して表示する（平文の鍵はどこにも出さない）
  let blob;
  try {
    const r = await fetch('https://auth.buffer.com/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({grant_type:'authorization_code', code:p.get('code'), redirect_uri:c.redirect_uri, code_verifier:s.verifier, client_id:c.client_id})});
    const j = await r.json();
    if (!j.refresh_token) throw new Error(JSON.stringify(j).slice(0, 200));
    blob = await encrypt({refresh_token:j.refresh_token, saved_at:Math.floor(Date.now()/1000)}, c.public_key_pem);
    document.getElementById('msg').textContent = '更新の鍵（暗号化済み）。data/buffer_token.enc に置く。';
  } catch (ex) {
    // うまくいかないときは、許可のしるしを暗号化して出す（data/buffer_grant.enc に置けば GitHub 側で交換する）
    blob = await encrypt({code:p.get('code'), verifier:s.verifier, redirect_uri:c.redirect_uri, at:Date.now()}, c.public_key_pem);
    document.getElementById('msg').textContent = 'その場での交換に失敗（' + ex.message + '）。許可のしるし（暗号化済み）。data/buffer_grant.enc に置く。';
  }
  sessionStorage.removeItem('pkce');
  history.replaceState(null, '', location.pathname);
  document.getElementById('blob').value = blob;
  document.getElementById('out').hidden = false;
  document.getElementById('go').hidden = true;
})();
</script>
</body></html>
