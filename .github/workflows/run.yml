name: probe-run
on:
  push:
    branches: [probe-web]
    paths: ['probe/run.sh']
permissions:
  contents: write
concurrency:
  group: probe-web
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash probe/run.sh > probe/run.log 2>&1 || true
      - run: |
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe data; git commit -q -m "run results [skip ci]"; git push
