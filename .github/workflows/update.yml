# 毎日、公式サイトから新しい結果を取り込み、サイトを作り直して公開する。
# 誰も触らなくても動き続けるように作ってある（GitHubの公開リポジトリなら無料）。
name: 毎日の更新と公開

on:
  schedule:
    - cron: '15 20 * * *'   # 毎日 日本時間 5:15
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取り込みプログラムの自己チェック
        run: python3 fetchers/test_all.py
      - name: 公式サイトから新しい結果を取り込む
        run: python3 fetch.py
        continue-on-error: true
      - name: Wikipediaから通算戦績を取り込む（毎月1日、まだ無いとき、または[wiki]と書いた更新のとき）
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ ! -f data/wiki/records.tsv ] || echo "${{ github.event.head_commit.message }}" | grep -q "\[wiki\]"; then python3 wiki_fetch.py; fi
        continue-on-error: true
      - name: 定期的な生存記録（60日間なにも変化がないと自動実行が止まるのを防ぐ）
        run: |
          d=$(date -u +%d)
          if [ "$d" = "01" ] || [ "$d" = "15" ]; then date -u +%Y-%m-%d > data/last_check.txt; fi
      - name: 取り込んだ結果を保存
        run: |
          git config user.name "japan-mma-record-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then git commit -m "自動更新 $(date -u +%Y-%m-%d)" && git push; fi
      - name: サイトを作る
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
