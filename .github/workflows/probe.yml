name: probe
on:
  push:
    branches: [probe-yt]
    paths: ['probe/urls.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out; i=0
          pip install -q -U yt-dlp || true
          while read u; do i=$((i+1)); if [[ "$u" == YTDLP\ * ]]; then timeout 900 yt-dlp --flat-playlist -J --ignore-errors "${u#YTDLP }" > "probe/out/$i.html" 2>"probe/out/$i.err"; echo "$i $u $(wc -c < probe/out/$i.html)" >> probe/out/index.txt; continue; fi; curl -sSL -A "Mozilla/5.0 (compatible; JapanMMARecordBot/1.0)" --max-time 60 "$u" -o "probe/out/$i.html" || echo "fail $u"; echo "$i $u $(wc -c < probe/out/$i.html)" >> probe/out/index.txt; sleep 2; done < probe/urls.txt
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out; git commit -m "probe results [skip ci]"; git push origin HEAD:probe-yt
