name: probe-euro
on:
  push:
    branches: [probe-euro]
    paths: ['probe/urls.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe/out; i=0
          while read u; do i=$((i+1)); for t in 1 2 3 4 5; do curl -sSL -A "JapanMMARecordBot/1.0 (https://japan-mma-record.github.io/; research bot)" --max-time 60 "$u" -o "probe/out/$i.html" || echo "fail $u"; if grep -q -E "too many requests|Attention Required" "probe/out/$i.html"; then sleep $((t*20)); else break; fi; done; echo "$i $u $(wc -c < probe/out/$i.html)" >> probe/out/index.txt; sleep 3; done < probe/urls.txt
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out; git commit -m "probe results [skip ci]"; git push
