name: probe-ufcall
on:
  push:
    branches: [probe-ufcall]
    paths: ['probe/urls.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf probe/out; mkdir -p probe/out
          nl -ba -w1 -s' ' probe/urls.txt > /tmp/list.txt
          cat /tmp/list.txt | xargs -P 6 -L 1 sh -c 'curl -sSL -A "Mozilla/5.0 (compatible; JapanMMARecordBot/1.0; +https://japan-mma-record.github.io/)" --retry 2 --max-time 90 "$1" -o "probe/out/$0.html" || echo "fail $1"; sleep 1'
          while read i u; do echo "$i $u $(wc -c < probe/out/$i.html 2>/dev/null || echo 0)" >> probe/out/index.txt; done < /tmp/list.txt
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out; git commit -q -m "probe results [skip ci]"; git push
