name: 毎日のSNS投稿（本日の大会・過去のこの日の大会）
on:
  schedule:
    - cron: '31 22 * * *'   # 毎日 日本時間 7:31（GitHub の混み具合で遅れることがある）
  workflow_dispatch:
    inputs:
      token_only:
        description: 'Buffer の鍵を新しくするだけ（投稿しない）'
        type: boolean
        default: false
permissions:
  contents: write   # Buffer の更新の鍵（暗号化したもの）をリポジトリに保存し直すため
concurrency:
  group: buffer-token   # 鍵の更新が2つ同時に走ると鍵が無効になるので、1つずつ
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: 投稿（X の鍵が Secrets にないときは投稿文の表示だけ）
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_INCLUDE_URL: ${{ vars.X_INCLUDE_URL }}
          X_LONG_POST: ${{ vars.X_LONG_POST }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_PRIVATE_KEY: ${{ secrets.BUFFER_PRIVATE_KEY }}
          BUFFER_CHANNEL_ID: '6b0a64f28541f09ecbce382d'   # Buffer につないだ X（@japanmmarecord）のチャンネル番号（秘密ではない）
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TOKEN_ONLY: ${{ inputs.token_only }}
        run: if [ "$TOKEN_ONLY" = "true" ]; then python3 buffer_token.py; else python3 xpost.py; fi
